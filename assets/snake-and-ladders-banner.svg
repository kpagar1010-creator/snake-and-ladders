<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Snake &amp; Ladders</title>
  <desc id="desc">A colorful illustrated board game banner with numbered squares, ladders, and snakes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#153f36"/>
      <stop offset="1" stop-color="#256d57"/>
    </linearGradient>
    <pattern id="squares" width="74" height="74" patternUnits="userSpaceOnUse">
      <rect width="74" height="74" fill="#f4f1e9"/>
      <rect width="37" height="37" fill="#e6ecdb"/>
      <rect x="37" y="37" width="37" height="37" fill="#e6ecdb"/>
    </pattern>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="1080" cy="30" r="180" fill="#f1bc5b" opacity=".1"/>
  <circle cx="60" cy="390" r="140" fill="#e98267" opacity=".12"/>
  <g transform="translate(720 60) rotate(7 190 150)">
