    <rect width="380" height="300" rx="12" fill="url(#squares)" stroke="#f1bc5b" stroke-width="10"/>
    <path d="M65 225 L130 145 L195 180 L270 75" fill="none" stroke="#256d57" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M53 236 L118 156 M77 246 L142 166 M183 190 L258 85 M207 200 L282 95" fill="none" stroke="#f1bc5b" stroke-width="5"/>
    <path d="M90 73 C135 25 180 112 225 65 S315 52 300 125 C288 181 230 130 214 189 S151 258 115 205" fill="none" stroke="#e98267" stroke-width="12" stroke-linecap="round"/>
    <circle cx="55" cy="260" r="17" fill="#e98267" stroke="#fff" stroke-width="4"/>
    <circle cx="320" cy="38" r="17" fill="#256d57" stroke="#fff" stroke-width="4"/>
    <text x="18" y="28" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#1e302b">100</text>
    <text x="327" y="286" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#1e302b">1</text>
  </g>
  <g font-family="Arial,sans-serif" fill="#fff">
    <text x="74" y="150" font-size="22" font-weight="700" letter-spacing="5" fill="#f1bc5b">A CLASSIC RACE TO 100</text>
    <text x="70" y="225" font-size="64" font-weight="800" letter-spacing="-2">Snake &amp; Ladders</text>
